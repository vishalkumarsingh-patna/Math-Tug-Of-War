<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Math Tug of War Pro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Setup Modal Styling */
        .setup-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1e40af; display: flex; justify-content: center; 
            align-items: center; z-index: 1000; color: white; text-align: center;
        }
        .setup-card { background: white; color: #333; padding: 40px; border-radius: 20px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .setup-card h2 { margin-bottom: 20px; color: #1e40af; }
        .setup-card select, .setup-card button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 1rem; }
        .btn-start { background: #22c55e; color: white; border: none !important; font-weight: bold; cursor: pointer; margin-top: 20px !important; }
        .btn-google { background: white; color: #555; border: 1px solid #ddd !important; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="setup-screen" class="setup-screen">
        <div class="setup-card">
            <h2>🎮 Game Settings</h2>
            
            <button class="btn-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="20"> 
                Login with Gmail
            </button>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

            <label>Set Time Limit (Seconds):</label>
            <select id="time-select">
                <option value="30">30 Seconds</option>
                <option value="60" selected>1 Minute</option>
                <option value="120">2 Minutes</option>
                <option value="300">5 Minutes</option>
            </select>

            <button class="btn-start" onclick="startGame()">START GAME</button>
        </div>
    </div>

    <div id="overlay" class="overlay">
        <div class="result-card">
            <h1 id="winner-text">TEAM 1 JEET GAYI!</h1>
            <button onclick="location.reload()">PHIR SE KHELO</button>
        </div>
    </div>

    <div class="top-nav">
        <button class="nav-btn" onclick="location.reload()">🏠 HOME</button>
        <div class="game-title">TUG OF WAR: MATHEMATICS</div>
        <div class="nav-btn">🇬🇧 EN ▾</div>
    </div>

    <div class="arena">
        <div class="panel blue-side">
            <div class="score-row">Team 1 <span id="scoreA">0</span></div>
            <div class="math-q" id="qA">-- + --</div>
            <div class="ans-screen" id="displayA">0</div>
            <div class="keypad">
                <button onclick="press(1,'A')">1</button><button onclick="press(2,'A')">2</button><button onclick="press(3,'A')">3</button>
                <button onclick="press(4,'A')">4</button><button onclick="press(5,'A')">5</button><button onclick="press(6,'A')">6</button>
                <button onclick="press(7,'A')">7</button><button onclick="press(8,'A')">8</button><button onclick="press(9,'A')">9</button>
                <button class="btn-red" onclick="clearInp('A')">X</button>
                <button onclick="press(0,'A')">0</button>
                <button class="btn-blue" id="btnA" onclick="submit('A')">✓</button>
            </div>
        </div>

        <div class="animation-zone">
            <div class="timer" id="timer">⏱ --:--</div>
            <div class="video-window">
                <div id="video-stage" class="video-stage">
                    <video id="tugVideo" autoplay loop muted playsinline>
                        <source src="Screen Recording 2026-03-11 224218.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="divider-line"></div>
            </div>
        </div>

        <div class="panel red-side">
            <div class="score-row">Team 2 <span id="scoreB">0</span></div>
            <div class="math-q" id="qB">-- + --</div>
            <div class="ans-screen" id="displayB">0</div>
            <div class="keypad">
                <button onclick="press(1,'B')">1</button><button onclick="press(2,'B')">2</button><button onclick="press(3,'B')">3</button>
                <button onclick="press(4,'B')">4</button><button onclick="press(5,'B')">5</button><button onclick="press(6,'B')">6</button>
                <button onclick="press(7,'B')">7</button><button onclick="press(8,'B')">8</button><button onclick="press(9,'B')">9</button>
                <button class="btn-red" onclick="clearInp('B')">X</button>
                <button onclick="press(0,'B')">0</button>
                <button class="btn-blue" id="btnB" onclick="submit('B')">✓</button>
            </div>
        </div>
    </div>

    <script>
        // Start Game Logic
        function startGame() {
            let selectedTime = document.getElementById('time-select').value;
            document.getElementById('setup-screen').style.display = 'none';
            
            // Ye function aapke script.js mein hona chahiye jo timer start kare
            if (typeof initGame === "function") {
                initGame(selectedTime);
            }
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
